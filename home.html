<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Basetis Style</title>
    <link rel="stylesheet" href="./styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="home-container">
        <h1>Bienvenido</h1>
        <div class="buttons-container">
            <button onclick="irABackOffice()" class="backoffice-button">
                Acceder al Back Office
            </button>
            <button onclick="cerrarSesion()" class="logout-button">
                Cerrar sesión
            </button>
        </div>
        <div class="office-map">
            <div class="desk" data-mesa="1">1</div>
            <div class="desk" data-mesa="2">2</div>
            <div class="desk" data-mesa="3">3</div>
            <div class="desk" data-mesa="4">4</div>
            <div class="desk" data-mesa="5">5</div>
            <div class="desk" data-mesa="6">6</div>
            <div class="desk" data-mesa="7">7</div>
            <div class="desk" data-mesa="8">8</div>
        </div>
        <div id="desk-info" class="desk-info" style="display:none;">
            Mesa seleccionada: <span id="desk-number"></span>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
